# The Validator gate (#810, F110). The merge queue requires the validator_pass
# check: on merge_group it passes only when every PR in the queue entry has a
# `validator` success status on its head sha. On pull_request it reports the
# state and passes, so a PR can wait for its PASS without a red check.
# Kept out of ci.yml: release.yml calls ci.yml with contents read only.
name: validator

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: validator-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validator_pass:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_validator_pass.py
