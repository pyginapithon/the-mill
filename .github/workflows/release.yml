# Ship path on GitHub. PyPI trusted publishing (OIDC): no stored token.
# The PyPI publisher is bound to this file name and the environment name, so
# renaming release.yml or the environments breaks publishing.
#   push v* tag        -> ci gates -> verify -> publish to PyPI (env: pypi)
#   workflow_dispatch  -> ci gates -> verify (dry run, publishes nothing)
# PyPI gets the same dist/ that ci built and check_pack scanned.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    # The private-name list for check_pack (#339); not a credential.
    secrets:
      MILL_PRIVATE_NAMES: ${{ secrets.MILL_PRIVATE_NAMES }}

  verify:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Tag matches the built version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          want="${REF_NAME#v}"
          ls "dist/the_mill-${want}-py3-none-any.whl" "dist/the_mill-${want}.tar.gz"
          test "$(find dist -maxdepth 1 -type f | wc -l)" = 2
      - run: python -m pip install --upgrade pip twine
      - env:
          MILL_PRIVATE_NAMES: ${{ secrets.MILL_PRIVATE_NAMES }}
        run: python tools/check_pack.py dist
      - run: python tools/precommit_hygiene.py tree
      - run: python -m twine check --strict dist/*

  publish_pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/the-mill/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
